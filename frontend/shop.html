<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop All Products | Shaneeq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="top-bar">
  <div class="container">
    <span>Free delivery on orders above Rs. 4,999</span>
    <a class="phone" href="tel:03134356819"><i class="fa-solid fa-phone"></i> 0313-4356819</a>
  </div>
</div>

<header class="site-header">
  <div class="container nav-wrap">
    <button class="mobile-nav-toggle" id="mobile-nav-toggle"><i class="fa-solid fa-bars"></i></button>
    <a href="index.html" class="logo">SHANEEQ<span>.</span></a>
    <nav class="main-nav">
      <a href="shop.html?category=Men">Men</a>
      <a href="shop.html?category=Women">Women</a>
      <a href="shop.html?category=Kids">Kids</a>
      <a href="shop.html">New Arrivals</a>
      <a href="track-order.html">Track Order</a>
    </nav>
    <div class="nav-icons">
      <div class="search-toggle-wrap">
        <button id="search-toggle"><i class="fa-solid fa-magnifying-glass"></i></button>
        <form id="search-form" class="search-box" id="search-box">
          <input type="text" placeholder="Search Shaneeq...">
          <button type="submit"><i class="fa-solid fa-arrow-right"></i></button>
        </form>
      </div>
      <button id="wishlist-btn"><i class="fa-regular fa-heart"></i><span class="badge" id="wishlist-count">0</span></button>
      <button id="cart-btn"><i class="fa-solid fa-bag-shopping"></i><span class="badge" id="cart-count">0</span></button>
    </div>
  </div>
</header>

<div class="mobile-nav" id="mobile-nav">
  <div class="close-btn" id="mobile-nav-close"><i class="fa-solid fa-xmark"></i></div>
  <a href="shop.html?category=Men">Men</a>
  <a href="shop.html?category=Women">Women</a>
  <a href="shop.html?category=Kids">Kids</a>
  <a href="shop.html">New Arrivals</a>
  <a href="track-order.html">Track Order</a>
  <a href="tel:03134356819">Call: 0313-4356819</a>
</div>

<section class="page-header">
  <h1 id="shop-heading">All Products</h1>
  <div class="crumbs"><a href="index.html">Home</a> / <span id="result-count">Loading…</span></div>
</section>

<section class="products-section">
  <div class="container">

    <!-- Category & Type Filters -->
    <div class="filter-bar">
      <button class="filter-chip" data-category="Men">Men</button>
      <button class="filter-chip" data-category="Women">Women</button>
      <button class="filter-chip" data-category="Kids">Kids</button>
      <span style="width:1px; background:var(--color-line); margin:0 6px;"></span>
      <button class="filter-chip" data-type="Stitched">Stitched</button>
      <button class="filter-chip" data-type="Unstitched">Unstitched</button>
    </div>

    <!-- Price Filter -->
    <form id="price-filter-form" style="display:flex; gap:12px; justify-content:center; align-items:center; margin-bottom:40px; flex-wrap:wrap;">
      <input type="number" id="min-price" placeholder="Min Price (Rs.)" style="padding:11px 14px; border:1px solid var(--color-line); border-radius:6px; width:160px;">
      <input type="number" id="max-price" placeholder="Max Price (Rs.)" style="padding:11px 14px; border:1px solid var(--color-line); border-radius:6px; width:160px;">
      <button type="submit" class="btn btn-outline" style="padding:11px 24px;">Apply</button>
    </form>

    <div class="product-grid" id="shop-grid"></div>

    <div class="load-more-wrap" id="pagination" style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;"></div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<div class="drawer-overlay" id="drawer-overlay"></div>
<div class="drawer" id="cart-drawer">
  <div class="drawer-header"><h3>Your Bag</h3><button class="drawer-close"><i class="fa-solid fa-xmark"></i></button></div>
  <div class="drawer-body" id="cart-drawer-body"></div>
  <div class="drawer-footer" id="cart-drawer-footer"></div>
</div>
<div class="drawer" id="wishlist-drawer">
  <div class="drawer-header"><h3>Your Wishlist</h3><button class="drawer-close"><i class="fa-solid fa-xmark"></i></button></div>
  <div class="drawer-body" id="wishlist-drawer-body"></div>
</div>

<a href="tel:03134356819" class="floating-call" title="Call us: 0313-4356819"><i class="fa-solid fa-phone"></i></a>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/footer.js"></script>
<script src="js/home.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
